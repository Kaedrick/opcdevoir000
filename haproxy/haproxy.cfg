global
  maxconn 100

defaults
  mode http
  timeout client 10s
  timeout connect 5s
  timeout server 10s
  timeout http-request 10s

resolvers docker
  nameserver dns1 127.0.0.11:53
  hold valid 10s

frontend web
  bind *:80
  default_backend webservers

backend webservers
  balance roundrobin
  option httpchk GET /
  http-check expect status 200
  default-server inter 2s fall 3 rise 2 resolvers docker init-addr libc,none
  server web1 webserver1:80 check
  server web2 webserver2:80 check
