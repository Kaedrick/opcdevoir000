---
- name: Deploy Angular app with Nginx
  hosts: web
  become: true

  vars:
    app_root: /var/www/angular-app

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Start and enable nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Copy Angular app
      ansible.builtin.copy:
        src: files/angular-app/
        dest: "{{ app_root }}/"
        owner: www-data
        group: www-data
        mode: "0644"
        directory_mode: "0755"

    - name: Deploy nginx config
      ansible.builtin.template:
        src: templates/angular-app.conf.j2
        dest: /etc/nginx/sites-available/angular-app.conf
        mode: "0644"
      notify: Restart nginx

    - name: Enable site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/angular-app.conf
        dest: /etc/nginx/sites-enabled/angular-app.conf
        state: link
      notify: Restart nginx

    - name: Remove default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart nginx

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
